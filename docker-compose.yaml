services:
  mc-server:
    image: itzg/minecraft-server:java25
    container_name: mc-server
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.3"
      ONLINE_MODE: "true"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      WHITELIST: "${MINECRAFT_WHITELIST:?Set MINECRAFT_WHITELIST in .env}"
      OPS: "${MINECRAFT_OPERATORS:?Set MINECRAFT_OPERATORS in .env}"
      ENABLE_RCON: "false"
      ENABLE_COMMAND_BLOCK: "false"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      MEMORY: 3G
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:25565:25565/tcp"
    volumes:
      - ./data:/data
    stop_grace_period: 3m
    stdin_open: true
    tty: true
    restart: unless-stopped

  plugin-build:
    image: gradle:9.1.0-jdk25
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - ./plugin:/workspace
      - ./data/plugins:/output
    command:
      - sh
      - -c
      - gradle --no-daemon --console=plain build && cp build/libs/paper-starter.jar /output/paper-starter.jar
